<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230"><defs><marker id="f5b6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker><marker id="f1d2330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="f2457c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker><marker id="fc46a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker><marker id="f1f8a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="f6b3fb8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb8"/></marker></defs><rect width="780" height="230" fill="#ffffff" rx="10"/><text x="20" y="26" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#1d2330" text-anchor="start" font-weight="700">LBU e LB leggono lo stesso byte: cambia con cosa riempiono i 24 bit alti</text><rect x="20" y="70" width="120" height="60" rx="6" fill="#e7f6ee" stroke="#1f8a5b" stroke-width="1.2" /><text x="80" y="92" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#1f8a5b" text-anchor="middle" font-weight="600">byte in memoria</text><text x="80" y="117" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" fill="#1d2330" text-anchor="middle" font-weight="700">F0</text><text x="80" y="150" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1d2330" text-anchor="middle" font-weight="400">1111 0000</text><rect x="44" y="137" width="11" height="18" rx="2" fill="none" stroke="#c46a12" stroke-width="1.8" /><text x="37" y="170" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="700">bit 7 = 1</text><line x1="142" y1="90" x2="238" y2="66" stroke="#5b6475" stroke-width="1.5" marker-end="url(#f5b6475)"/><line x1="142" y1="112" x2="238" y2="150" stroke="#5b6475" stroke-width="1.5" marker-end="url(#f5b6475)"/><text x="248" y="54" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#2457c5" text-anchor="start" font-weight="700">LBU</text><rect x="300" y="40" width="58" height="34" rx="3" fill="#ffffff" stroke="#5b6475" stroke-width="1.2" /><text x="329" y="63" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="700">00</text><rect x="362" y="40" width="58" height="34" rx="3" fill="#ffffff" stroke="#5b6475" stroke-width="1.2" /><text x="391" y="63" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="700">00</text><rect x="424" y="40" width="58" height="34" rx="3" fill="#ffffff" stroke="#5b6475" stroke-width="1.2" /><text x="453" y="63" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#5b6475" text-anchor="middle" font-weight="700">00</text><rect x="486" y="40" width="58" height="34" rx="3" fill="#f2f3f6" stroke="#1d2330" stroke-width="1.2" /><text x="515" y="63" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#1d2330" text-anchor="middle" font-weight="700">F0</text><text x="560" y="62" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#2457c5" text-anchor="start" font-weight="600">zeri: «unsigned»</text><text x="248" y="160" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#c46a12" text-anchor="start" font-weight="700">LB</text><rect x="300" y="145" width="58" height="34" rx="3" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="329" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#c46a12" text-anchor="middle" font-weight="700">FF</text><rect x="362" y="145" width="58" height="34" rx="3" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="391" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#c46a12" text-anchor="middle" font-weight="700">FF</text><rect x="424" y="145" width="58" height="34" rx="3" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="453" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#c46a12" text-anchor="middle" font-weight="700">FF</text><rect x="486" y="145" width="58" height="34" rx="3" fill="#f2f3f6" stroke="#1d2330" stroke-width="1.2" /><text x="515" y="168" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" fill="#1d2330" text-anchor="middle" font-weight="700">F0</text><text x="560" y="160" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#c46a12" text-anchor="start" font-weight="600">copie del bit 7: «signed»</text><text x="560" y="177" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#5b6475" text-anchor="start" font-weight="400">bit 7 = 0 (byte 00..7F) → 00 come LBU</text><text x="20" y="215" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#1d2330" text-anchor="start" font-weight="400">F0 letto unsigned = 240; letto signed = −16. Il testo dice quale: «byte unsigned» → LBU, «byte signed» → LB.</text></svg>
