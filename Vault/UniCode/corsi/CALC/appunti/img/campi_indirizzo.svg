<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250"><defs><marker id="fc46a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker><marker id="f2457c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker><marker id="f6b3fb8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb8"/></marker><marker id="f1f8a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="f1d2330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="f5b6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="780" height="250" fill="#ffffff" rx="10"/><text x="20" y="26" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#1d2330" text-anchor="start" font-weight="700">Dove va ogni bit di BA: esempio blocco da 512 MB (2^29) in 4 banchi da 128 MB (2^27)</text><rect x="20.0" y="60" width="69.375" height="44" rx="3" fill="#f1ebfb" stroke="#6b3fb8" stroke-width="1.2" /><text x="54.6875" y="87" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#6b3fb8" text-anchor="middle" font-weight="700">firma</text><text x="22.0" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="start" font-weight="400">BA31</text><text x="87.375" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="end" font-weight="400">BA29</text><rect x="89.375" y="60" width="624.375" height="44" rx="3" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="401.5625" y="87" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#2457c5" text-anchor="middle" font-weight="700">cella dentro il banco</text><text x="91.375" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="start" font-weight="400">BA28</text><text x="711.75" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="end" font-weight="400">BA2</text><rect x="713.75" y="60" width="46.25" height="44" rx="3" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="715.75" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="start" font-weight="400">BA1</text><text x="758.0" y="119" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10" fill="#5b6475" text-anchor="end" font-weight="400">BA0</text><line x1="54.6875" y1="126" x2="120" y2="188" stroke="#6b3fb8" stroke-width="1.5" marker-end="url(#f6b3fb8)"/><rect x="10.0" y="190" width="220" height="48" rx="6" fill="#f1ebfb" stroke="#6b3fb8" stroke-width="1.2" /><text x="120" y="210" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" fill="#6b3fb8" text-anchor="middle" font-weight="700">P2 · nel CS</text><text x="120" y="228" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d2330" text-anchor="middle" font-weight="400">CS = BA31*·BA30·BA29*·BEi</text><line x1="401.5625" y1="126" x2="401.5625" y2="188" stroke="#2457c5" stroke-width="1.5" marker-end="url(#f2457c5)"/><rect x="286.5625" y="190" width="230" height="48" rx="6" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="401.5625" y="210" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" fill="#2457c5" text-anchor="middle" font-weight="700">P3 · ai piedini del banco</text><text x="401.5625" y="228" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d2330" text-anchor="middle" font-weight="400">A[26..0] ← BA[28..2]</text><line x1="736.875" y1="126" x2="650" y2="188" stroke="#c46a12" stroke-width="1.5" marker-end="url(#fc46a12)"/><rect x="550.0" y="190" width="200" height="48" rx="6" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="650" y="210" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" fill="#c46a12" text-anchor="middle" font-weight="700">non escono dal DLX</text><text x="650" y="228" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d2330" text-anchor="middle" font-weight="400">al loro posto BE0..BE3</text><text x="20" y="168" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">3 + 27 + 2 = 32 fili: se il conto non torna, un bit è finito nel campo sbagliato.</text></svg>
