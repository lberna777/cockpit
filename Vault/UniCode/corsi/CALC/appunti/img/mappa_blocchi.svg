izio + taglia = primo fuori   →   fine = primo fuori − 1</text><text x="20" y="232" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" fill="#1d2330" text-anchor="start" font-weight="400">40000000h + 20000000h = 60000000h  →  fine 5FFFFFFFh          RAM in alto: FFFFFFFFh − 80000000h + 1 = 80000000h (inizio)</text></svg>
