<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330"><defs><marker id="f5b6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker><marker id="f1d2330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="f2457c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker><marker id="fc46a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker><marker id="f1f8a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="f6b3fb8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb8"/></marker></defs><rect width="780" height="330" fill="#ffffff" rx="10"/><text x="20" y="28" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1d2330" text-anchor="start" font-weight="700">Sotto lo zero si ricomincia dal numero più grande</text><rect x="20" y="170" width="102" height="40" rx="6" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.2" /><text x="71.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#c46a12" text-anchor="middle" font-weight="700">FFFFFFF0</text><rect x="126" y="170" width="102" height="40" rx="6" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="177.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#2457c5" text-anchor="middle" font-weight="700">FFFFFFF1</text><text x="283.0" y="196" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#5b6475" text-anchor="middle" font-weight="400">… 12 caselle …</text><rect x="338" y="170" width="102" height="40" rx="6" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="389.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#2457c5" text-anchor="middle" font-weight="700">FFFFFFFE</text><rect x="444" y="170" width="102" height="40" rx="6" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="495.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#2457c5" text-anchor="middle" font-weight="700">FFFFFFFF</text><rect x="550" y="170" width="102" height="40" rx="6" fill="#e7f6ee" stroke="#1f8a5b" stroke-width="1.2" /><text x="601.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#1f8a5b" text-anchor="middle" font-weight="700">00000000</text><rect x="656" y="170" width="102" height="40" rx="6" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.2" /><text x="707.0" y="196" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#2457c5" text-anchor="middle" font-weight="700">00000001</text><line x1="548" y1="156" x2="548" y2="224" stroke="#c46a12" stroke-width="2" stroke-dasharray="4 3"/><text x="548" y="240" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#c46a12" text-anchor="middle" font-weight="600">qui il conto «gira»</text><path d="M601.0,166 C601.0,136 495.0,136 495.0,164" stroke="#2457c5" stroke-width="1.5" fill="none" marker-end="url(#f2457c5)"/><text x="548.0" y="140" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#2457c5" text-anchor="middle" font-weight="700">−1</text><path d="M601.0,164 C601.0,70 71.0,70 71.0,164" stroke="#c46a12" stroke-width="2" fill="none" marker-end="url(#fc46a12)"/><text x="336.0" y="52" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13.5" fill="#c46a12" text-anchor="middle" font-weight="700">−10h  (16 passi indietro)</text><text x="336.0" y="72" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1d2330" text-anchor="middle" font-weight="400">SUBI R22,R0,0x0010   →   R22 = FFFFFFF0h</text><text x="20" y="270" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">Come il contachilometri a 4 cifre:</text><rect x="250" y="250" width="96" height="30" rx="4" fill="#222833" stroke="#222833" stroke-width="1.2" /><text x="298" y="271" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">0000</text><rect x="440" y="250" width="96" height="30" rx="4" fill="#222833" stroke="#222833" stroke-width="1.2" /><text x="488" y="271" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">9999</text><line x1="352" y1="265" x2="434" y2="265" stroke="#2457c5" stroke-width="1.5" marker-end="url(#f2457c5)"/><text x="393" y="258" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11" fill="#2457c5" text-anchor="middle" font-weight="600">−1 km</text><text x="560" y="263" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">in esadecimale la cifra</text><text x="560" y="279" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#5b6475" text-anchor="start" font-weight="400">più grande è F, non 9</text><text x="20" y="314" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#1d2330" text-anchor="start" font-weight="400">Quanti passi? Da 00000000 a FFFFFFF0 mancano 10h = 16: il primo passo porta a FFFFFFFF, gli altri 15 scendono fino a F0.</text></svg>
