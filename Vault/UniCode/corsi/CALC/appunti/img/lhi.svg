<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170"><defs><marker id="f5b6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker><marker id="f1d2330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="f2457c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker><marker id="fc46a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker><marker id="f1f8a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="f6b3fb8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb8"/></marker></defs><rect width="780" height="170" fill="#ffffff" rx="10"/><text x="20" y="26" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#1d2330" text-anchor="start" font-weight="700">LHI: il numero va nella metà alta, la metà bassa diventa 0 (sempre)</text><text x="20" y="66" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" fill="#6b3fb8" text-anchor="start" font-weight="700">LHI R20,0x8000</text><rect x="260" y="42" width="160" height="36" rx="3" fill="#f1ebfb" stroke="#6b3fb8" stroke-width="1.2" /><text x="340" y="66" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" fill="#6b3fb8" text-anchor="middle" font-weight="700">8000</text><rect x="424" y="42" width="160" height="36" rx="3" fill="#fff" stroke="#5b6475" stroke-width="1.2" /><text x="504" y="66" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" fill="#5b6475" text-anchor="middle" font-weight="700">0000</text><text x="600" y="65" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#5b6475" text-anchor="start" font-weight="400">R20 = 80000000h</text><text x="340" y="96" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#6b3fb8" text-anchor="middle" font-weight="400">metà alta (16 bit)</text><text x="504" y="96" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="10.5" fill="#5b6475" text-anchor="middle" font-weight="400">metà bassa</text><text x="20" y="136" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f8a5b" text-anchor="start" font-weight="700">ORI R20,R20,0x0010</text><rect x="260" y="112" width="160" height="36" rx="3" fill="#f1ebfb" stroke="#6b3fb8" stroke-width="1.2" /><text x="340" y="136" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" fill="#6b3fb8" text-anchor="middle" font-weight="700">8000</text><rect x="424" y="112" width="160" height="36" rx="3" fill="#e7f6ee" stroke="#1f8a5b" stroke-width="1.2" /><text x="504" y="136" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f8a5b" text-anchor="middle" font-weight="700">0010</text><text x="600" y="135" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#5b6475" text-anchor="start" font-weight="400">R20 = 80000010h</text><text x="20" y="164" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#5b6475" text-anchor="start" font-weight="400">Qualunque cosa ci fosse prima in R20, dopo LHI la metà bassa è 0000.</text></svg>
