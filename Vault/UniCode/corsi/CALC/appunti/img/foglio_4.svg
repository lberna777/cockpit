<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300"><defs><marker id="fc46a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker><marker id="f2457c5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2457c5"/></marker><marker id="f6b3fb8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3fb8"/></marker><marker id="f1f8a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker><marker id="f1d2330" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker><marker id="f5b6475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="780" height="300" fill="#ffffff" rx="10"/><text x="20" y="26" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" fill="#1d2330" text-anchor="start" font-weight="700">Il foglio d'esame in quattro riquadri</text><rect x="20" y="40" width="365" height="118" rx="8" fill="#eaf0fd" stroke="#2457c5" stroke-width="1.5" /><text x="34" y="66" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#2457c5" text-anchor="start" font-weight="700">①  Dati</text><text x="34" y="92" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">dal testo: taglie, porte, registri</text><text x="34" y="112" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">fissi DLX: 32 bit, 4 banchi,</text><text x="34" y="132" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">BA1–0 → BE, EPROM solo lettura</text><rect x="395" y="40" width="365" height="118" rx="8" fill="#e7f6ee" stroke="#1f8a5b" stroke-width="1.5" /><text x="409" y="66" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#1f8a5b" text-anchor="start" font-weight="700">②  Linea degli indirizzi</text><text x="409" y="92" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">16 tacche = prima cifra hex</text><text x="409" y="112" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">EPROM dal basso, RAM in alto,</text><text x="409" y="132" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">porte nel buco</text><rect x="20" y="168" width="365" height="118" rx="8" fill="#f1ebfb" stroke="#6b3fb8" stroke-width="1.5" /><text x="34" y="194" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#6b3fb8" text-anchor="start" font-weight="700">③  Tabella della risposta</text><text x="34" y="220" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">una riga per blocco: taglia, inizio–fine,</text><text x="34" y="240" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">firma, CS, banco 2^k, piedini, WR?</text><text x="34" y="260" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">poi CS_…_i = CS · BEi</text><rect x="395" y="168" width="365" height="118" rx="8" fill="#fdf1e3" stroke="#c46a12" stroke-width="1.5" /><text x="409" y="194" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#c46a12" text-anchor="start" font-weight="700">④  Controlli</text><text x="409" y="220" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">somme e 8 cifre</text><text x="409" y="240" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">bit che cambiano = esponente</text><text x="409" y="260" font-family="Inter, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" fill="#1d2330" text-anchor="start" font-weight="400">CS a coppie, repliche in zone libere</text></svg>
